version: "3"

vars:
  HEARTHD_BIN: '{{env "HOME"}}/.local/bin/hearthd'

tasks:
  test:
    desc: Run the Rust workspace test suite (needs docker running, tailscale, nc, ps, sh)
    dir: rust
    cmds:
      - cargo test --workspace

  clippy:
    desc: Lint the Rust workspace exactly as CI does (warnings are errors)
    dir: rust
    cmds:
      - cargo clippy --workspace --all-targets -- -D warnings

  install:
    desc: Build release hearthd and install it onto ~/.local/bin (ad-hoc signed)
    dir: rust
    cmds:
      - npm --prefix crates/hearth-web/ui ci
      - npm --prefix crates/hearth-web/ui run build
      - cargo build --release -p hearthd
      - mkdir -p "$(dirname "{{.HEARTHD_BIN}}")"
      - cp target/release/hearthd "{{.HEARTHD_BIN}}"
      # Required after every copy on macOS, or the binary won't launch.
      - codesign --sign - --force "{{.HEARTHD_BIN}}"
      - echo "installed $("{{.HEARTHD_BIN}}" --version) at {{.HEARTHD_BIN}}"

  catalog:package:
    desc: Build shared-service tarballs into dist/catalog (`task catalog:package -- redis`; default all)
    cmds:
      - scripts/catalog/package.sh {{.CLI_ARGS}}

  catalog:write:
    desc: Regenerate catalog.json and scripts/catalog/MANIFEST from dist/catalog/*.sha256
    cmds:
      - python3 scripts/catalog/write-catalog.py

  catalog:smoke:
    desc: Attach every shipped shared service against the local dist/catalog tarballs (throwaway HOME)
    cmds:
      - scripts/catalog/smoke.sh

  ci:
    desc: Everything CI runs (Rust test + clippy)
    cmds:
      - task: test
      - task: clippy

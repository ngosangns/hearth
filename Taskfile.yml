version: "3"

vars:
  MACOS_DIR: apps/macos
  APP_NAME: Hearth.app
  HEARTHD_BIN: "/Applications/Hearth.app/Contents/Resources/hearthd/bin/hearthd"

tasks:
  dev:
    desc: Build, launch, and watch the macOS app — rebuilds and relaunches on every source change (fswatch)
    dir: "{{.MACOS_DIR}}"
    cmds:
      - ./scripts/dev.sh

  rust:test:
    desc: Run the Rust workspace test suite (needs docker running, tailscale, nc, ps, sh)
    dir: rust
    cmds:
      - cargo test --workspace

  rust:clippy:
    desc: Lint the Rust workspace exactly as CI does (warnings are errors)
    dir: rust
    cmds:
      - cargo clippy --workspace --all-targets -- -D warnings

  rust:install:
    desc: Build the hearthd binary in release mode and install it into Hearth.app (ad-hoc signed)
    dir: rust
    cmds:
      - cargo build --release -p hearthd
      - mkdir -p "/Applications/Hearth.app/Contents/Resources/hearthd/bin"
      - cp target/release/hearthd "{{.HEARTHD_BIN}}"
      # Required after every copy on macOS, or the binary won't launch.
      - codesign --sign - --force "{{.HEARTHD_BIN}}"
      - rm -f /opt/homebrew/bin/hearthd
      - echo "installed $("{{.HEARTHD_BIN}}" --version) at {{.HEARTHD_BIN}}"

  ci:
    desc: Everything CI runs (Rust test + clippy)
    cmds:
      - task: rust:test
      - task: rust:clippy

  macos:build:
    desc: Build the macOS app (debug)
    dir: "{{.MACOS_DIR}}"
    cmds:
      - swift build

  macos:test:
    desc: Run the macOS app's Swift test suite (local only — the CI runner has no XCTest)
    dir: "{{.MACOS_DIR}}"
    cmds:
      - swift test

  macos:icon:
    desc: Regenerate AppIcon.icns from scripts/make-icon.swift
    dir: "{{.MACOS_DIR}}"
    cmds:
      - ./scripts/generate-icon.sh

  macos:package:
    desc: Package a local ad-hoc-signed "Hearth.app" (release build)
    dir: "{{.MACOS_DIR}}"
    cmds:
      - ./scripts/build-app.sh release

  macos:install:
    desc: Package the app and install it into /Applications, replacing any running/existing copy, then launch it
    deps: [macos:package]
    dir: "{{.MACOS_DIR}}"
    cmds:
      - pkill -f "{{.APP_NAME}}/Contents/MacOS/HearthApp" || true
      - rm -rf "/Applications/{{.APP_NAME}}"
      - cp -R ".build/{{.APP_NAME}}" "/Applications/{{.APP_NAME}}"
      - open "/Applications/{{.APP_NAME}}"

version: "3"

vars:
  HEARTH_BIN: '{{env "HOME"}}/.local/bin/hearth'

tasks:
  test:
    desc: Run the Rust workspace test suite (needs docker running, tailscale, nc, ps, sh)
    dir: rust
    cmds:
      - cargo test --workspace

  clippy:
    desc: Lint the Rust workspace exactly as CI does (warnings are errors)
    dir: rust
    cmds:
      - cargo clippy --workspace --all-targets -- -D warnings

  install:
    desc: Build release hearth, sign the versioned binary, and symlink ~/.local/bin/hearth to it
    dir: rust
    cmds:
      - cargo build --release -p hearth
      # Sign a new inode, then point the symlink at it. codesign --force on a mapped
      # binary SIGKILLs that process, and cp onto the symlink would collapse this layout.
      - |
        set -eu
        version="$(awk -F'"' '$1 ~ /^version = / { print $2; exit }' bin/hearth/Cargo.toml)"
        test -n "$version"
        dest_dir="{{env "HOME"}}/.local/share/hearth/bin"
        link="{{.HEARTH_BIN}}"
        dest="$dest_dir/hearth-$version"
        staged="$dest_dir/.hearth-$version.staging.$$"
        mkdir -p "$dest_dir" "$(dirname "$link")"
        cp target/release/hearth "$staged"
        codesign --sign - --force "$staged"
        chmod 755 "$staged"
        mv -f "$staged" "$dest"
        aside=""
        if [ -e "$link" ] && [ ! -L "$link" ]; then
          aside="$dest_dir/hearth-previous-$$"
          mv -f "$link" "$aside"
        fi
        tmp="$(dirname "$link")/.hearth-link.$$"
        ln -s "../share/hearth/bin/hearth-$version" "$tmp"
        if ! mv -f "$tmp" "$link"; then
          rm -f "$tmp"
          if [ -n "$aside" ] && [ ! -e "$link" ]; then
            mv -f "$aside" "$link"
          fi
          exit 1
        fi
        # 0.18.0 renamed the command. Drop the old symlink; leave the versioned file a
        # running daemon may still have mapped.
        legacy="$(dirname "$link")/hearthd"
        if [ -L "$legacy" ]; then
          rm -f "$legacy"
        fi
        echo "installed $("$link" --version) at $link -> $dest"

  app:build:
    desc: Build the macOS Hearth.app bundle (SwiftUI + bundled release hearth) into apps/macos-swiftui/.build
    deps: [install]
    cmds:
      - sh apps/macos-swiftui/scripts/bundle.sh

  app:test:
    desc: Run the SwiftUI app tests (apps/macos-swiftui), same role as synca's `make test`
    dir: apps/macos-swiftui
    cmds:
      - swift test

  app:clean:
    desc: Remove the SwiftPM build and any Hearth.app next to the package
    dir: apps/macos-swiftui
    cmds:
      - rm -rf .build Hearth.app

  app:install:
    desc: Build Hearth.app and rsync it into /Applications (quits a running copy first)
    deps: [app:build]
    cmds:
      - osascript -e 'quit app "Hearth"' 2>/dev/null || true
      - |
        set -eu
        app="apps/macos-swiftui/.build/Hearth.app"
        test -d "$app"
        mkdir -p /Applications/Hearth.app
        rsync -a --delete "$app"/ /Applications/Hearth.app/
        echo "installed: $app -> /Applications/Hearth.app"

  go:build:
    desc: Build the Go supervisor port (no installable binary yet; library packages only)
    dir: go
    cmds:
      - go build ./...

  go:test:
    desc: Run the Go port tests, same role as synca's `make -C go test`
    dir: go
    cmds:
      - go test ./...

  go:clean:
    desc: Remove Go build cache for this module
    dir: go
    cmds:
      - go clean ./...

  catalog:package:
    desc: Build shared-service tarballs into dist/catalog (`task catalog:package -- redis`; default all)
    cmds:
      - scripts/catalog/package.sh {{.CLI_ARGS}}

  catalog:write:
    desc: Regenerate catalog.json and scripts/catalog/MANIFEST from dist/catalog/*.sha256
    cmds:
      - python3 scripts/catalog/write-catalog.py

  catalog:smoke:
    desc: Attach every shipped shared service against the local dist/catalog tarballs (throwaway HOME)
    cmds:
      - scripts/catalog/smoke.sh

  ci:
    desc: Everything CI runs (Rust test + clippy)
    cmds:
      - task: test
      - task: clippy

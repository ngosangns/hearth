version: "3"

vars:
  HEARTH_BIN: '{{env "HOME"}}/.local/bin/hearth'

tasks:
  test:
    desc: Run the Go test suite (needs docker running, tailscale, nc, ps, sh)
    dir: go
    cmds:
      - go test ./...

  clippy:
    desc: Lint the Go module exactly as CI does (vet + gofmt)
    dir: go
    cmds:
      - go vet ./...
      - test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }

  install:
    desc: Build release hearth, sign the versioned binary, and symlink ~/.local/bin/hearth to it
    dir: go
    cmds:
      - |
        set -eu
        version="$(cat ../VERSION)"
        test -n "$version"
        CGO_ENABLED=0 go build -trimpath -ldflags "-s -w -X main.version=$version" -o hearth-build ./cmd/hearth
      # Sign a new inode, then point the symlink at it. codesign --force on a mapped
      # binary SIGKILLs that process, and cp onto the symlink would collapse this layout.
      - |
        set -eu
        version="$(cat ../VERSION)"
        test -n "$version"
        dest_dir="{{env "HOME"}}/.local/share/hearth/bin"
        link="{{.HEARTH_BIN}}"
        dest="$dest_dir/hearth-$version"
        staged="$dest_dir/.hearth-$version.staging.$$"
        mkdir -p "$dest_dir" "$(dirname "$link")"
        cp hearth-build "$staged"
        codesign --sign - --force "$staged"
        chmod 755 "$staged"
        mv -f "$staged" "$dest"
        rm -f hearth-build
        aside=""
        if [ -e "$link" ] && [ ! -L "$link" ]; then
          aside="$dest_dir/hearth-previous-$$"
          mv -f "$link" "$aside"
        fi
        tmp="$(dirname "$link")/.hearth-link.$$"
        ln -s "../share/hearth/bin/hearth-$version" "$tmp"
        if ! mv -f "$tmp" "$link"; then
          rm -f "$tmp"
          if [ -n "$aside" ] && [ ! -e "$link" ]; then
            mv -f "$aside" "$link"
          fi
          exit 1
        fi
        # 0.18.0 renamed the command. Drop the old symlink; leave the versioned file a
        # running daemon may still have mapped.
        legacy="$(dirname "$link")/hearthd"
        if [ -L "$legacy" ]; then
          rm -f "$legacy"
        fi
        echo "installed $("$link" --version) at $link -> $dest"

  go:build:
    desc: Build the Go module and the hearth binary into go/hearth
    dir: go
    cmds:
      - go build -trimpath -ldflags "-s -w -X main.version=$(cat ../VERSION)" -o hearth ./cmd/hearth

  go:test:
    desc: Run the Go test suite (same as `task test`)
    dir: go
    cmds:
      - go test ./...

  go:clean:
    desc: Remove the built binary and Go build cache for this module
    dir: go
    cmds:
      - rm -f hearth
      - go clean ./...

  catalog:package:
    desc: Build shared-service tarballs into dist/catalog (`task catalog:package -- redis`; default all)
    cmds:
      - scripts/catalog/package.sh {{.CLI_ARGS}}

  catalog:write:
    desc: Regenerate catalog.json and scripts/catalog/MANIFEST from dist/catalog/*.sha256
    cmds:
      - python3 scripts/catalog/write-catalog.py

  catalog:smoke:
    desc: Attach every shipped shared service against the local dist/catalog tarballs (throwaway HOME)
    cmds:
      - scripts/catalog/smoke.sh

  ci:
    desc: Everything CI runs (Go test + vet/gofmt)
    cmds:
      - task: test
      - task: clippy

  dev:install:
    desc: Build the GUI from ../ns-gpui and install "Hearth Dev.app" into ~/Applications
    cmds:
      - ../ns-gpui/scripts/install-dev.sh hearth

  dev:install:all:
    desc: Install the hearth CLI, then its Dev app
    cmds:
      - task: install
      - task: dev:install

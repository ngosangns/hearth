[workspace]
resolver = "2"
members = ["crates/hearth-core", "crates/hearth-cli", "crates/hearth-tui", "crates/hearth-mcp", "bin/hearth"]

# The `hearth` bin is a thin dispatcher, but at O3 LLVM spends ~5 min inside one codegen
# unit: every cross-crate-inlinable callee (`hearth_cli::main_inner`, rmcp `serve_inner`,
# the TUI shell loop, …) is instantiated here, so `main` alone is ~110k lines of IR before
# the inliner runs. O2 compiles the same code ~6x faster; deps stay at O3.
[profile.release.package.hearth]
opt-level = 2

[workspace.package]
edition = "2021"
publish = false

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
serde_yaml = "0.9"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
uuid = { version = "1", features = ["v4"] }
sha2 = "0.10"
hmac = "0.12"
subtle = "2"
base64 = "0.23"
regex = "1"
async-trait = "0.1"
tokio-util = "0.7"
tempfile = "3"
# Per-crate extras (`stream`, rmcp's client/transport features) are added with `features = [...]`
# next to `workspace = true`; features are additive.
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
rmcp = { version = "3", features = ["server", "transport-io"] }

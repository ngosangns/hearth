[workspace]
resolver = "2"
members = ["crates/hearth-core", "crates/hearth-cli", "crates/hearth-tui", "crates/hearth-mcp", "bin/hearth"]

[workspace.package]
edition = "2021"
publish = false

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
serde_yaml = "0.9"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
uuid = { version = "1", features = ["v4"] }
sha2 = "0.10"
hmac = "0.12"
subtle = "2"
base64 = "0.23"
regex = "1"
async-trait = "0.1"
tokio-util = "0.7"
tempfile = "3"
# Per-crate extras (`stream`, rmcp's client/transport features) are added with `features = [...]`
# next to `workspace = true`; features are additive.
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
rmcp = { version = "3", features = ["server", "transport-io"] }

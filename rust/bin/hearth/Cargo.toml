[package]
name = "hearth"
version = "0.23.0"
edition.workspace = true
publish.workspace = true

[[bin]]
name = "hearth"
path = "src/main.rs"

[dependencies]
hearth-core = { path = "../../crates/hearth-core" }
hearth-cli = { path = "../../crates/hearth-cli" }
hearth-tui = { path = "../../crates/hearth-tui" }
hearth-mcp = { path = "../../crates/hearth-mcp" }
tokio = { workspace = true }
rmcp = { workspace = true }

[dev-dependencies]
serde_json = { workspace = true }
tempfile = { workspace = true }
rmcp = { workspace = true, features = ["client", "transport-child-process"] }

[package]
name = "ls-mcp"
version = "0.1.0"
edition.workspace = true
publish.workspace = true

[dependencies]
ls-core = { path = "../ls-core" }
ls-cli = { path = "../ls-cli" }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
uuid = { workspace = true }
async-trait = "0.1"
regex = "1"
percent-encoding = "2"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
rmcp = { version = "3", features = ["server", "transport-io"] }

[dev-dependencies]
tempfile = "3"
rmcp = { version = "3", features = ["server", "client", "transport-io", "transport-async-rw"] }

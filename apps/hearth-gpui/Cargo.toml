[package]
name = "hearth-gpui"
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false
rust-version = "1.95"

[[bin]]
name = "hearth-gpui"
path = "src/main.rs"

[features]
devtools = ["ns-ui/devtools"]

[dependencies]
gpui = { package = "gpui-pre", version = "=0.3.8" }
ely-gpui-component = { git = "https://github.com/ELY-Open-Source/Ely-GPUI-Components", rev = "cd365e92ea0c4467c439b8253963461ba0f6d155" }
ns-ui = { git = "https://github.com/ngosangns/ns-gpui", rev = "c589b091c79d0d80d497343e4fb1a41aad539b25" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[workspace]
resolver = "3"

# Smaller dev builds (2026-10-24 disk cleanup): keep line info for backtraces, drop full debuginfo;
# no debuginfo at all for dependencies.
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false

name: Rust signing spike (throwaway)

# Phase 0 of the Rust-rewrite plan (see AGENTS.md's compiled-binary sharp edge): validate whether a
# freshly-compiled, ad-hoc-signed Rust binary gets SIGKILLed on launch on the registered
# `self-hosted, macmini` runner the same way a `bun build --compile` binary was — that finding is
# documented as an endpoint-security heuristic against newly-written unsigned executables, not
# something specific to Bun. This workflow (and this whole spike crate) is deleted once the question
# is answered; it is not part of the shipped rewrite.
on:
  workflow_dispatch:

jobs:
  spike:
    runs-on: [self-hosted, macmini]
    steps:
      - name: Ensure a Rust toolchain is available
        run: |
          if ! command -v cargo >/dev/null 2>&1; then
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal
          fi
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
      - name: Build, ad-hoc sign, and run a trivial binary
        run: |
          set -euo pipefail
          work="$(mktemp -d)"
          mkdir -p "$work/src"
          cat > "$work/Cargo.toml" <<'EOF'
          [package]
          name = "signing-spike"
          version = "0.1.0"
          edition = "2021"
          [[bin]]
          name = "signing-spike"
          path = "src/main.rs"
          EOF
          cat > "$work/src/main.rs" <<'EOF'
          fn main() { println!("hello from a freshly-compiled, ad-hoc-signed rust binary (CI runner)"); }
          EOF
          cd "$work"
          cargo build --release
          bin="target/release/signing-spike"
          codesign --force --deep --sign - "$bin"
          codesign -dv "$bin"
          echo "==> running it 10 times"
          for i in $(seq 1 10); do
            "$bin"
          done
          echo "==> SUCCESS: no SIGKILL across 10 runs on this runner"

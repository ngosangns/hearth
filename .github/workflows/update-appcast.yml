name: Update Appcast

# Regenerates appcast.xml from the latest stable GitHub release and deploys it to GitHub Pages.
# The release workflow already does this after it signs and uploads. This exists so a bad pages
# deploy can be rebuilt without packaging the app again — the same manual path xmannv/xkey uses.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-appcast:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Generate appcast.xml
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: python3 .github/scripts/generate_appcast.py --from-github --output appcast.xml
      - name: Prepare deployment directory
        run: |
          mkdir -p gh-pages-deploy
          cp appcast.xml gh-pages-deploy/
      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./gh-pages-deploy
          publish_branch: gh-pages
          keep_files: false
          enable_jekyll: false
          user_name: github-actions[bot]
          user_email: github-actions[bot]@users.noreply.github.com
          commit_message: Update appcast.xml

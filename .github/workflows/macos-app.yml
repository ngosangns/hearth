name: macOS App

on:
  pull_request:
    paths: ["apps/macos/**"]
  push:
    branches: [main]
    paths: ["apps/macos/**"]
  # The path filter above means a change to this workflow file does not trigger it — so a manual
  # run is the only way to verify a change here (an action bump, a new step) before it matters.
  workflow_dispatch:

jobs:
  build:
    # Never run a fork's pull request on the shared self-hosted runner (same guard as ci.yml).
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, macmini]
    defaults:
      run:
        working-directory: apps/macos
    steps:
      - uses: actions/checkout@v7
      # Not `swift test`: the registered self-hosted runner's toolchain doesn't have XCTest available
      # (`no such module 'XCTest'`) — it only has the Command Line Tools, not a full Xcode.app
      # install, unlike this repo's own dev machines. `swift build` alone never touches the test
      # target. Tests/HearthAppTests still exists and runs fine with `swift test` locally on a
      # machine with full Xcode; wiring it into CI is blocked on that runner's Xcode setup, a separate
      # infra fix outside this repo's own commits (see AGENTS.md).
      - run: swift build

name: macOS app

# Builds the NativePHP desktop app after Release has published hearth-<tag>, then uploads the
# DMG beside that asset. workflow_run does not carry the tag, so Release's run-name is the tag
# and this job reads it from display_title. PHP and Node stay off the Rust CI job.
#
# A GITHUB_TOKEN release does not trigger `release: published`, which is why this listens to the
# Release workflow instead. Apple signing uses NATIVEPHP_APPLE_ID, NATIVEPHP_APPLE_ID_PASS, and
# NATIVEPHP_APPLE_TEAM_ID. Do not set CSC_IDENTITY_AUTO_DISCOVERY=false here: Developer ID has to
# be discoverable. This workflow is not notarized by a local build.

on:
  workflow_run:
    workflows: [Release]
    types: [completed]

permissions:
  contents: write

jobs:
  app:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      startsWith(github.event.workflow_run.display_title, 'v')
    runs-on: [self-hosted, macmini]
    timeout-minutes: 120
    env:
      RELEASE_TAG: ${{ github.event.workflow_run.display_title }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.RELEASE_TAG }}
      - uses: ./.github/actions/toolchain-path
        with:
          tools: gh curl brew
      - name: Install PHP 8.3, Composer, and Node 22
        shell: bash
        run: |
          set -euo pipefail
          if ! php -r 'exit(PHP_VERSION_ID >= 80300 && PHP_VERSION_ID < 80400 ? 0 : 1);' 2>/dev/null; then
            brew install php@8.3
          fi
          if ! command -v composer >/dev/null 2>&1; then
            brew install composer
          fi
          if ! node -v 2>/dev/null | grep -q '^v22\.'; then
            brew install node@22
          fi
          prefix() { brew --prefix "$1" 2>/dev/null || true; }
          for dir in "$(prefix php@8.3)/bin" "$(prefix php@8.3)/sbin" "$(prefix node@22)/bin" "$(prefix composer)/bin"; do
            if [ -d "$dir" ]; then
              echo "$dir" >> "$GITHUB_PATH"
            fi
          done
      - name: Read the app version and download the hearth asset
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          test -n "${RELEASE_TAG}"
          version="$(sed -n 's/^version = "\([0-9][0-9]*\.[0-9][0-9]*\.[0-9][0-9]*\)"/\1/p' rust/bin/hearth/Cargo.toml | head -1)"
          test -n "${version}"
          echo "NATIVEPHP_APP_VERSION=${version}" >> "$GITHUB_ENV"
          mkdir -p apps/macos/extras
          gh release download "$RELEASE_TAG" --pattern "hearth-${RELEASE_TAG}" --output apps/macos/extras/hearth
          chmod +x apps/macos/extras/hearth
          ./apps/macos/extras/hearth --version
      - name: Build the app
        shell: bash
        working-directory: apps/macos
        env:
          NATIVEPHP_APPLE_ID: ${{ secrets.NATIVEPHP_APPLE_ID }}
          NATIVEPHP_APPLE_ID_PASS: ${{ secrets.NATIVEPHP_APPLE_ID_PASS }}
          NATIVEPHP_APPLE_TEAM_ID: ${{ secrets.NATIVEPHP_APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          composer install --no-dev --no-interaction
          php artisan native:install --force --quiet
          php artisan native:build mac arm64 --no-interaction
      - name: Upload the DMG
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          dmg="$(find apps/macos/nativephp/electron/dist -name 'Hearth-*-arm64.dmg' -type f | head -1)"
          test -n "${dmg}"
          gh release upload "$RELEASE_TAG" "$dmg" --clobber

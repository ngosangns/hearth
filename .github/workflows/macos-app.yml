name: macOS App

on:
  pull_request:
    paths: ["apps/macos/**"]
  push:
    branches: [main]
    paths: ["apps/macos/**"]

jobs:
  build:
    runs-on: [self-hosted, macmini]
    defaults:
      run:
        working-directory: apps/macos
    steps:
      - uses: actions/checkout@v4
      - run: swift build

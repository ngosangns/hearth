name: Release

# Tag pushes (`v*.*.*`) are the release signal — `git tag v0.10.0 && git push --tags`. The tag push
# runs CI (ci.yml) first; this workflow starts when that CI run completes and only publishes if it
# succeeded, so a tag whose tests or clippy fail never gets a release asset. It builds the release
# `hearthd` binary and attaches it to the GitHub Release.
#
# `workflow_run` always runs this file from the default branch, and `github.ref*` there describe
# that branch — the tag and commit come from `github.event.workflow_run` instead.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]

permissions:
  contents: write

jobs:
  hearthd:
    # For a tag push, `head_branch` is the tag name. CI's other push trigger is `main`, and PR runs
    # are excluded by the event check.
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      startsWith(github.event.workflow_run.head_branch, 'v')
    runs-on: [self-hosted, macmini]
    defaults:
      run:
        working-directory: rust
    env:
      RELEASE_TAG: ${{ github.event.workflow_run.head_branch }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
      # `gh` lives in Homebrew's bin dir, which the runner service's PATH lacks as well as cargo's.
      - uses: ./.github/actions/toolchain-path
        with:
          tools: cargo gh node npm
      - name: Build web UI
        working-directory: rust/crates/hearth-web/ui
        run: npm ci && npm run build
      - name: Build hearthd
        run: |
          set -euo pipefail
          cargo build --release -p hearthd
          # Ad-hoc sign after the copy-equivalent link, or macOS kills the binary on launch.
          codesign --sign - --force target/release/hearthd
          cp target/release/hearthd "hearthd-${RELEASE_TAG}"
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # Idempotent so a re-run of a failed/partial release job still lands the asset.
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" "hearthd-${RELEASE_TAG}" --clobber
          else
            gh release create "$RELEASE_TAG" "hearthd-${RELEASE_TAG}" \
              --title "$RELEASE_TAG" --generate-notes --verify-tag
          fi

name: Release

# Tag pushes (`v*.*.*`) are the release signal — `git tag v0.10.0 && git push --tags`. The tag push
# runs CI (ci.yml) first; this workflow starts when that CI run completes and only publishes if it
# succeeded, so a tag whose tests or clippy fail never gets a release asset. It builds the
# ad-hoc-signed Hearth.app and attaches a zip to the GitHub Release the app's "Check for Updates…"
# link points at.
#
# `workflow_run` always runs this file from the default branch, and `github.ref*` there describe
# that branch — the tag and commit come from `github.event.workflow_run` instead.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]

permissions:
  contents: write

jobs:
  macos-app:
    # For a tag push, `head_branch` is the tag name. CI's other push trigger is `main`, and PR runs
    # are excluded by the event check.
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      startsWith(github.event.workflow_run.head_branch, 'v')
    runs-on: [self-hosted, macmini]
    env:
      RELEASE_TAG: ${{ github.event.workflow_run.head_branch }}
      APP_ZIP: Hearth-${{ github.event.workflow_run.head_branch }}-macos.zip
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
      # `gh` (used in the publish step) lives in Homebrew's bin dir, which the runner service's
      # PATH lacks as well as cargo's.
      - uses: ./.github/actions/toolchain-path
        with:
          tools: cargo swift gh
      - name: Package Hearth.app
        run: apps/macos/scripts/build-app.sh release
      # ditto, not zip(1): preserves the resource forks/quarantine metadata a signed .app needs when
      # unzipped on another machine.
      - name: Zip the app bundle
        working-directory: apps/macos/.build
        run: |
          set -euo pipefail
          rm -f "$APP_ZIP"
          ditto -c -k --keepParent Hearth.app "$APP_ZIP"
          shasum -a 256 "$APP_ZIP"
      - name: Publish GitHub Release
        working-directory: apps/macos/.build
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # Idempotent so a re-run of a failed/partial release job still lands the asset.
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" "$APP_ZIP" --clobber
          else
            gh release create "$RELEASE_TAG" "$APP_ZIP" \
              --title "$RELEASE_TAG" --generate-notes --verify-tag
          fi

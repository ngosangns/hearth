name: CI

on:
  pull_request:
  push:
    branches: [main]
    tags: ["v*.*.*"]

permissions:
  contents: read
  packages: write

jobs:
  test:
    runs-on: [self-hosted, macmini]
    steps:
      - uses: actions/checkout@v4
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun test

  # The in-progress Rust rewrite (`rust/`, see AGENTS.md "Rust rewrite") — a separate job so a
  # rust/-only regression can't be missed just because the TS suite above is green, and vice versa.
  rust-test:
    runs-on: [self-hosted, macmini]
    defaults:
      run:
        working-directory: rust
    steps:
      - uses: actions/checkout@v4
      - run: cargo test --workspace
      - run: cargo clippy --workspace --all-targets -- -D warnings

  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: test
    runs-on: [self-hosted, macmini]
    steps:
      - uses: actions/checkout@v4
      - run: |
          echo "@gnasdev:registry=https://npm.pkg.github.com" >> .npmrc
          echo "//npm.pkg.github.com/:_authToken=${NODE_AUTH_TOKEN}" >> .npmrc
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - run: bun install --frozen-lockfile
      - name: Verify tag matches package.json version
        run: |
          tag_version="${GITHUB_REF_NAME#v}"
          pkg_version="$(bun -e "console.log(require('./package.json').version)")"
          if [ "$tag_version" != "$pkg_version" ]; then
            echo "tag $GITHUB_REF_NAME does not match package.json version $pkg_version" >&2
            exit 1
          fi
      - run: bunx npm publish

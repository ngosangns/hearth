name: CI

on:
  pull_request:
  push:
    branches: [main]
    tags: ["v*.*.*"]
  # publish.yml calls this as the release gate: an empty ref checks out the event as usual.
  workflow_call:
    inputs:
      ref:
        description: "Ref to test (empty = the caller's ref)"
        required: false
        type: string
        default: ""

permissions:
  contents: read

jobs:
  go-test:
    # The self-hosted runner shares a user account with other repos' runners: never run code from
    # a fork's pull request on it. Same-repo PRs and pushes run as usual.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, macmini]
    timeout-minutes: 90
    defaults:
      run:
        working-directory: go
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}
      # The runner service has no login-shell PATH; see the action for why.
      - uses: ./.github/actions/toolchain-path
        with:
          tools: go
      - run: go version
      - run: go build ./...
      - run: go test ./...
      - run: go vet ./...
      - name: gofmt check
        run: |
          set -euo pipefail
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "$unformatted"
            exit 1
          fi

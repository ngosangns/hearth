name: CI

on:
  pull_request:
  push:
    branches: [main]
    tags: ["v*.*.*"]

permissions:
  contents: read

jobs:
  rust-test:
    # The self-hosted runner shares a user account with other repos' runners: never run code from
    # a fork's pull request on it. Same-repo PRs and pushes run as usual.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, macmini]
    defaults:
      run:
        working-directory: rust
    steps:
      - uses: actions/checkout@v7
      # The runner service has no login-shell PATH; see the action for why.
      - uses: ./.github/actions/toolchain-path
      - run: cargo --version && rustc --version
      - run: cargo test --workspace
      # The runner's toolchain is managed by rustup, whose stable toolchain does not include clippy
      # unless the component is added. Dev machines here use Homebrew's rust, which bundles it.
      - name: Ensure clippy is available
        run: |
          set -euo pipefail
          if cargo clippy --version >/dev/null 2>&1; then
            echo "clippy already available: $(cargo clippy --version)"
            exit 0
          fi
          if ! command -v rustup >/dev/null 2>&1; then
            echo "clippy is missing and rustup is not available to install it" >&2
            exit 1
          fi
          rustup component add clippy
      - run: cargo clippy --workspace --all-targets -- -D warnings

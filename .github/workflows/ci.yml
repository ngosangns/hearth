name: CI

on:
  pull_request:
  push:
    branches: [main]
    tags: ["v*.*.*"]

permissions:
  contents: read

jobs:
  rust-test:
    runs-on: [self-hosted, macmini]
    defaults:
      run:
        working-directory: rust
    steps:
      - uses: actions/checkout@v7
      # A self-hosted runner executes `run:` steps from its service environment, which is not a
      # login shell — so a toolchain installed into the user's home (rustup) or under Homebrew is
      # absent from PATH here even though `cargo` works fine in a terminal on that same machine.
      - name: Put cargo on PATH
        run: |
          set -euo pipefail
          for candidate in "$HOME/.cargo/bin" /opt/homebrew/bin /usr/local/bin; do
            if [ -x "$candidate/cargo" ]; then
              echo "using cargo at $candidate/cargo"
              echo "$candidate" >> "$GITHUB_PATH"
              exit 0
            fi
          done
          echo "cargo not found in: $HOME/.cargo/bin /opt/homebrew/bin /usr/local/bin" >&2
          echo "install a Rust toolchain on this runner, or add cargo's directory to the list above" >&2
          exit 1
      - run: cargo --version && rustc --version
      - run: cargo test --workspace
      # The runner's toolchain is managed by rustup, whose stable toolchain does not include clippy
      # unless the component is added. Dev machines here use Homebrew's rust, which bundles it.
      - name: Ensure clippy is available
        run: |
          set -euo pipefail
          if cargo clippy --version >/dev/null 2>&1; then
            echo "clippy already available: $(cargo clippy --version)"
            exit 0
          fi
          if ! command -v rustup >/dev/null 2>&1; then
            echo "clippy is missing and rustup is not available to install it" >&2
            exit 1
          fi
          rustup component add clippy
      - run: cargo clippy --workspace --all-targets -- -D warnings
